<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">portfolio-site-builder</title>
  <desc id="d">An agent skill that builds fact-checked, multilingual portfolio websites.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062520"/>
      <stop offset="0.55" stop-color="#0f4e44"/>
      <stop offset="1" stop-color="#137a64"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ecbd47" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ecbd47" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="win"><rect x="760" y="70" width="440" height="290" rx="16"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes rise { 0%, 8% { opacity: 0; transform: translateY(14px); } 22%, 88% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(0); } }
      .r1 { animation: rise 7s ease-out 0s infinite backwards; }
      .r2 { animation: rise 7s ease-out .35s infinite backwards; }
      .r3 { animation: rise 7s ease-out .7s infinite backwards; }
      .r4 { animation: rise 7s ease-out 1.05s infinite backwards; }
      @keyframes slide { 0%, 45% { transform: translateX(0); } 50%, 95% { transform: translateX(46px); } 100% { transform: translateX(0); } }
      .pill { animation: slide 7s cubic-bezier(.77,0,.175,1) infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .caret { animation: blink 1.1s step-end infinite; }
      @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .float { animation: floaty 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .r1, .r2, .r3, .r4 { animation: none; opacity: 1; } .pill, .caret, .float { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- left: title -->
  <g class="sans">
    <rect x="72" y="78" width="168" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="156" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#f3d27a" letter-spacing="1.5">AGENT SKILL</text>
    <text x="72" y="170" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">portfolio-site</text>
    <text x="72" y="228" font-size="54" font-weight="800" fill="#ecbd47" letter-spacing="-1">-builder</text>
    <text x="72" y="276" font-size="21" fill="#d6f2e7">Fact-checked, multilingual portfolio sites</text>
    <text x="72" y="304" font-size="21" fill="#d6f2e7">for real people, built with any AI agent.</text>
  </g>
  <g class="mono" font-size="15" fill="#afe4d2">
    <rect x="72" y="332" width="448" height="40" rx="10" fill="#000000" fill-opacity="0.28"/>
    <text x="90" y="357"><tspan fill="#ecbd47">$</tspan> intake → research → build → SEO → launch<tspan class="caret" fill="#ffffff"> ▍</tspan></text>
  </g>

  <!-- right: browser mock -->
  <g class="float">
    <rect x="760" y="70" width="440" height="290" rx="16" fill="#ffffff"/>
    <g clip-path="url(#win)">
      <rect x="760" y="70" width="440" height="40" fill="#effaf6"/>
      <circle cx="784" cy="90" r="6" fill="#f87171"/>
      <circle cx="804" cy="90" r="6" fill="#fbbf24"/>
      <circle cx="824" cy="90" r="6" fill="#34d399"/>
      <rect x="846" y="80" width="230" height="20" rx="10" fill="#ffffff" stroke="#d6f2e7"/>
      <text x="860" y="95" class="mono" font-size="11" fill="#0f6253">yourname.dev/en/about</text>
      <!-- language toggle -->
      <rect x="1094" y="79" width="94" height="22" rx="11" fill="#ffffff" stroke="#d6f2e7"/>
      <rect class="pill" x="1096" y="81" width="44" height="18" rx="9" fill="#0f6253"/>
      <text x="1118" y="94" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#7bcfb7">EN</text>
      <text x="1164" y="94" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#7bcfb7">TH</text>

      <!-- page content -->
      <g class="r1">
        <circle cx="812" cy="160" r="30" fill="#afe4d2"/>
        <circle cx="812" cy="152" r="11" fill="#0f6253"/>
        <path d="M792 182 q20 -22 40 0" fill="#0f6253"/>
        <rect x="858" y="140" width="190" height="16" rx="5" fill="#062520"/>
        <rect x="858" y="164" width="140" height="10" rx="5" fill="#7bcfb7"/>
        <rect x="1080" y="140" width="96" height="30" rx="15" fill="#0f6253"/>
        <rect x="1096" y="152" width="64" height="6" rx="3" fill="#ffffff"/>
      </g>
      <g class="r2">
        <rect x="784" y="212" width="124" height="62" rx="12" fill="#effaf6" stroke="#d6f2e7"/>
        <text x="800" y="246" class="sans" font-size="22" font-weight="800" fill="#0f6253">80+</text>
        <rect x="800" y="256" width="70" height="6" rx="3" fill="#afe4d2"/>
      </g>
      <g class="r3">
        <rect x="918" y="212" width="124" height="62" rx="12" fill="#effaf6" stroke="#d6f2e7"/>
        <text x="934" y="246" class="sans" font-size="22" font-weight="800" fill="#0f6253">2×</text>
        <rect x="934" y="256" width="78" height="6" rx="3" fill="#afe4d2"/>
      </g>
      <g class="r4">
        <rect x="1052" y="212" width="124" height="62" rx="12" fill="#fbf1d3" stroke="#f3d27a"/>
        <text x="1068" y="246" class="sans" font-size="22" font-weight="800" fill="#86600f">✓ src</text>
        <rect x="1068" y="256" width="62" height="6" rx="3" fill="#f3d27a"/>
      </g>
      <g class="r4">
        <rect x="784" y="290" width="392" height="10" rx="5" fill="#d6f2e7"/>
        <rect x="784" y="310" width="330" height="10" rx="5" fill="#d6f2e7"/>
        <rect x="784" y="330" width="250" height="10" rx="5" fill="#d6f2e7"/>
      </g>
    </g>
  </g>

  <!-- floating chips -->
  <g class="sans" font-size="13" font-weight="700">
    <g class="float" style="animation-delay:-1.5s">
      <rect x="640" y="96" width="98" height="30" rx="15" fill="#ecbd47"/>
      <text x="689" y="116" text-anchor="middle" fill="#062520">JSON-LD</text>
    </g>
    <g class="float" style="animation-delay:-3s">
      <rect x="664" y="302" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="704" y="322" text-anchor="middle" fill="#ffffff">llms.txt</text>
    </g>
    <g class="float" style="animation-delay:-.8s">
      <rect x="1140" y="368" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="1188" y="388" text-anchor="middle" fill="#ffffff">hreflang</text>
    </g>
  </g>
</svg>
